# Synthetic topology for isolated development
define command {
    command_name check_fixture
    command_line /bin/true
}
define host {
    host_name POP001
    alias North POP
    address 192.0.2.1
    check_command check_fixture
    max_check_attempts 1
}
define host {
    host_name POP002
    alias South POP
    address 192.0.2.2
    check_command check_fixture
    max_check_attempts 1
}
define host {
    host_name KELURAHAN
    alias Kelurahan switch
    address 192.0.2.3
    parents POP001 ; Keep this comment
    check_command check_fixture
    max_check_attempts 1
}
define host {
    host_name AP1
    alias Access point
    address 192.0.2.4
    parents KELURAHAN,POP002
    check_command check_fixture
    max_check_attempts 1
}
define timeperiod {
    timeperiod_name fixture_period
    alias Fixture period
    monday 00:00-24:00
}
define contact {
    contact_name fixture
    alias Synthetic contact
    host_notification_period fixture_period
    service_notification_period fixture_period
    host_notification_options n
    service_notification_options n
    host_notification_commands check_fixture
    service_notification_commands check_fixture
}
define service {
    host_name POP001,POP002,KELURAHAN,AP1
    service_description Fixture status
    check_command check_fixture
    max_check_attempts 1
    check_interval 5
    retry_interval 1
    check_period fixture_period
}
