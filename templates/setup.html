<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Time Setup - Nagios Dashboard</title>
    <link rel="icon" type="image/png" href="/static/assets/img/icon.png">
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css?v=20261113-noc10">
    <link rel="stylesheet" href="/static/css/setup.css?v=20261113-noc9">
</head>
<body>
    <div class="setup-container">
        <img src="/static/assets/img/icon.png" alt="">
        <h1>Nagios Dashboard</h1>
        <p class="subtitle">Create the first administrator account</p>

        <div class="info">
            <strong>Welcome!</strong><br>
            LDAP server is ready. The first user will be created as <strong>Administrator</strong> with full access to all features.
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username (e.g., randi)">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="cn" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Surname</label>
                <input type="text" name="sn" required placeholder="Enter surname">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit">Create Administrator Account</button>
        </form>
    </div>
</body>
</html>
