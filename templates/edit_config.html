{% extends "base.html" %}
{% block title %}Edit Config - {{ server_name }}{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/servers.css?v=20261113-noc7">
{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-file-code"></i> Edit Config</h1>
    <p>localhost.cfg for {{ server_name }}</p>
</div>
<div class="cfg-card">
    <form method="POST" action="/servers/edit-config/{{ server_name }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="cfg-label" for="cfgContent">localhost.cfg</label>
        <textarea id="cfgContent" name="content" class="cfg-editor" required wrap="off">{{ content }}</textarea>
        <div class="cfg-actions">
            <button type="submit" class="btn-primary">Save &amp; Restart</button>
            <a href="/servers" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
